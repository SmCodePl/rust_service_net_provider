[package]
name = "net-services"
version = "0.1.0"
edition = "2021"


[dependencies]
dotenv = "0.15" 
chrono = { version = "0.4.39", features = ["serde"] }
diesel = { version = "2.2.7", features = ["chrono", "postgres","r2d2"] }
r2d2 = "0.8.10"
serde = { version = "1.0.218", features = ["derive"] }
actix-web = "4.9.0"
log = "0.4.25"
env_logger = "0.11.3"
async-trait = "0.1.86"

